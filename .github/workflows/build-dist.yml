name: Build Production Dist for cPanel

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-commit-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build production dist folder
        run: npm run build

      - name: Copy .htaccess into dist
        run: cp public/.htaccess dist/.htaccess || true

      - name: Commit and push dist folder to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git diff --staged --quiet || (git commit -m "chore: auto-build dist folder for cPanel [skip ci]" && git push)
